name: Bug report
description: Something in Piklin doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this. Please don't attach photos or videos you wouldn't want to be public.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Piklin version
      description: Shown in the menu under About Piklin
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution
      placeholder: "Linux Mint 22.1, Ubuntu 24.04, Debian 13…"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Terminal output
      description: Start Piklin from a terminal with `piklin`, make the problem happen, and paste anything it printed.
      render: text
